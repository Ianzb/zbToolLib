name: Upload Python Package

on:

permissions:
  contents: write
  id-token: write

jobs:
  release-build:
    name: Build distributions
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.meta.outputs.package }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Clean previous builds
        run: |
          rm -rf dist/ build/ *.egg-info/ || true

      - name: Build distributions (sdist and wheel)
        run: |
          python -m build --sdist --wheel

      - name: Extract package name and version from pyproject.toml
        id: meta
        run: |
          python - <<'PY'
          import tomllib, pathlib
          p = pathlib.Path('pyproject.toml')
          data = tomllib.loads(p.read_text(encoding='utf-8'))
          proj = data.get('project', {})
          pkg = proj.get('name', 'PACKAGE_NAME_PLACEHOLDER')
          ver = proj.get('version', '')
          # Emit outputs in GITHUB_OUTPUT format
          print(f"package={pkg}")
          print(f"version={ver}")
          PY
        shell: bash

      - name: Verify built version
        run: |
          ls -l dist || (echo "No dist directory found" && exit 1)
          if [ -z "${{ steps.meta.outputs.version }}" ]; then
            echo "Version not extracted from pyproject.toml" && exit 1
          fi
          echo "Looking for version '${{ steps.meta.outputs.version }}' in dist filenames"
          if ! ls dist | grep -F "${{ steps.meta.outputs.version }}" >/dev/null 2>&1; then
            echo "ERROR: built distribution filenames do not include version '${{ steps.meta.outputs.version }}'" && exit 1
          fi

      - name: Upload distributions as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      id-token: write

    environment: release

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: false
          verbose: true

