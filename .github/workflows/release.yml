name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

jobs:
  release-build:
    name: 构建发行包
    runs-on: windows-latest
    outputs:
      package: ${{ steps.meta.outputs.package }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: 安装 uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: 安装项目
        run: uv sync --no-group dev

      - name: 更新版本号
        shell: pwsh
        run: |
          $inputVersion = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrEmpty($inputVersion)) {
            Write-Host "未指定版本号，使用当前版本号"
            uv run script\release_build.py
          } else {
            Write-Host "使用指定版本号: $inputVersion"
            uv run script\release_build.py -v "$inputVersion"
          }

      - name: 构建分发包
        run: |
          uv build --no-sources

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/

      - name: 发布到 PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: false
          verbose: true
